          effective=$(git -c commit.gpgsign=false commit-tree "$expected" -p "$original" -m "test(ci): replay historical PR $pr $stage $ARM")
          git checkout --detach "$effective"
          test "$(git rev-parse HEAD^{tree})" = "$expected"
          test -z "$(git status --porcelain)"
          echo "HISTORICAL_RECEIPT arm=$ARM stage=$stage pr=$pr original=$original original_tree=$original_tree commit=$effective tree=$expected lock=$lock"
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # Same signed upstream cache already trusted by nixfiles and pinned
          # llm-agents.nix; no unsigned substitution or package changes.
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Configure existing signed SplitCast cache
        if: matrix.workload == 'neko7-splitcast-runtime'
        run: |
          set -euo pipefail
          policy=$(nix eval --json --file modules/50-features/media/_internal/cache.nix)
          jq -er '."extra-substituters" | join(" ") | "extra-substituters = " + .' <<< "$policy" | sudo tee -a /etc/nix/nix.conf
          jq -er '."extra-trusted-public-keys" | join(" ") | "extra-trusted-public-keys = " + .' <<< "$policy" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon.service
          nix config show | grep -Fx 'require-sigs = true'
      - name: Build and inspect independent artifact
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          set -euo pipefail
          # Keep terminal errors visible even if a massive compile overwhelms
          # the workflow log service.
          if ! out=$(nix build -L --no-link --print-out-paths ".#packages.x86_64-linux.$WORKLOAD" 2> "$RUNNER_TEMP/workload-build.log"); then
            tail -n 150 "$RUNNER_TEMP/workload-build.log" >&2
            exit 1
          fi
          tail -n 40 "$RUNNER_TEMP/workload-build.log" >&2
          case "$WORKLOAD" in
            neko7-minecraft-system)
              test -x "$out/init"
              test -x "$out/bin/switch-to-configuration"
              ;;
            neko7-t3-runtime)
              test -x "$out/bin/t3"
              test -x "$out/bin/codex"
