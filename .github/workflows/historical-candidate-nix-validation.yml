          echo "3baecc85c32c3f089cb50ad18984a2c050e51fc77f2dc35d8222a74f41043549  $RUNNER_TEMP/repair.patch" | sha256sum --check --strict
          git apply --index --check "$RUNNER_TEMP/repair.patch"
