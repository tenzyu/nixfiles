# Diagnostic only. No PRs or integration refs are changed.
name: Diagnostic historical semantic replay fixtures
on:
  push:
    branches: [diagnostics/historical-semantic-replay-fixtures]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git fetch --no-tags origin 1672c3831724f0f347245f197dd58aa97d563206
          python3 scripts/ci/verification-convergence/prepare_historical.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-fixture-receipts
          path: ${{ runner.temp }}/historical-fixtures/fixtures.json
          retention-days: 3
