name: Compute host integration
on:
  pull_request:
    paths:
      - 'modules/00-hosts/neko7/**'
      - 'modules/40-workloads/**'
      - 'justfile'
      - 'tools/instance-ops.sh'
      - 'tools/vm-resources.sh'
      - 'modules/50-features/monitoring/**'
      - 'modules/50-features/networking/preview-gateway.nix'
      - 'modules/50-features/development/execution-discovery.nix'
      - 'modules/50-features/development/_internal/execution-discovery.sh'
      - 'modules/50-features/development/_internal/execution-discovery-test.sh'
      - 'modules/50-features/development/_internal/execution.md'
      - 'modules/10-foundations/_internal/multi-machine-lab-test.nix'
      - 'modules/10-foundations/_internal/platform-services-test.nix'
      - 'modules/10-foundations/instance-recipes-check.nix'
      - 'modules/50-features/containers/incus.nix'
      - 'modules/50-features/game-servers/**'
      - 'modules/50-features/development/t3code-neko7.nix'
      - 'modules/50-features/media/splitcast-production.nix'
      - 'modules/10-foundations/_internal/workload-lifecycle-test.nix'
      - 'modules/10-foundations/_internal/workload-lifecycle-test.py'
      - 'tools/nspawn-profile-switch.sh'
      - 'modules/50-features/networking/tailnet-ingress.nix'
      - 'modules/10-foundations/_internal/tailnet-ingress-test.nix'
      - 'modules/10-foundations/compute-host-checks.nix'
      - 'modules/10-foundations/_internal/compute-host-test.nix'
      - 'modules/10-foundations/_internal/compute-host-test.py'
      - '.github/workflows/compute-host.yml'
      - 'flake.lock'
      - 'flake.nix'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compute-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    name: Platform ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [multi-machine-lab, platform-services]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute NixOS machine evidence
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          nix build -L --no-link .#checks.x86_64-linux.${{ matrix.check }}
  discover-workloads:
    name: Discover independent image outputs and validate operator menu
    runs-on: ubuntu-latest
    outputs:
      workloads: ${{ steps.outputs.outputs.workloads }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - id: outputs
        run: |
          set -euo pipefail
          workloads=$(nix eval --json .#packages.x86_64-linux --apply builtins.attrNames | jq -c '[.[] | select(startswith("neko7-") and endswith("-image")) | sub("^neko7-"; "") | sub("-image$"; "")]')
          echo "workloads=$workloads" >> "$GITHUB_OUTPUT"
          nix build -L --no-link .#checks.x86_64-linux.instance-recipes
  personal-workloads:
    needs: discover-workloads
    if: needs.discover-workloads.outputs.workloads != '[]'
    name: Build ${{ matrix.workload }} image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.discover-workloads.outputs.workloads) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build independent VM image and system
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          out=$(nix build -L --no-link --print-out-paths .#neko7-${{ matrix.workload }}-image)
          test -s "$out/nixos.qcow2"
          test -s "$out/metadata.tar.xz"
          nix build -L --no-link .#neko7-${{ matrix.workload }}-system
      - name: Boot actual service module and test private reachability
        run: nix build -L --no-link .#checks.x86_64-linux.personal-workload-${{ matrix.workload }}
      - name: Evaluate native exact-image lifecycle checks
        run: |
          nix eval --raw .#checks.x86_64-linux.incus-workload-${{ matrix.workload }}.drvPath
  workload-lifecycle:
    name: Independent workload deployment and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate production deployment boundaries
        run: |
          set -euo pipefail
          attr=.#nixosConfigurations.neko7.config
          nix eval --raw "$attr.containers.neko7-mc.path" | grep -Fx /nix/var/nix/profiles/system
          nix eval --json "$attr.home-manager.users.tenzyu.systemd.user.services.t3code-neko7.Service.ExecStart" | jq -e 'all(.[]; contains("/nix/profiles/t3-runtime/bin/t3"))'
          nix eval --json "$attr.home-manager.users.tenzyu.local.features.splitcast-production-profile.enable" | jq -e '. == true'
          nix eval --json "$attr.home-manager.users.tenzyu.services.splitcast.enable" | jq -e '. == false'
          nix eval --json "$attr.system.preSwitchChecks" --apply builtins.attrNames | jq -e 'index("minecraft-workload-profile") != null and index("neko7-workload-profiles") != null'
          host_drv=$(nix eval --raw "$attr.system.build.toplevel.drvPath")
          nix-store --query --requisites "$host_drv" > /tmp/neko7-host-derivations
          for name in neko7-minecraft-system neko7-t3-runtime neko7-splitcast-runtime; do
            drv=$(nix eval --raw ".#packages.x86_64-linux.$name.drvPath")
            if grep -Fxq "$drv" /tmp/neko7-host-derivations; then
              echo "::error::$name is coupled to the host generation"
              exit 1
            fi
          done
      - name: Exercise real native guest profile update and rollback
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          nix build -L --no-link .#checks.x86_64-linux.workload-lifecycle
  workload-artifacts:
    name: Build ${{ matrix.workload }} deployment artifact
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        workload: [neko7-minecraft-system, neko7-t3-runtime, neko7-splitcast-runtime]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # Same signed upstream cache already trusted by nixfiles and pinned
          # llm-agents.nix; no unsigned substitution or package changes.
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Build and inspect independent artifact
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          set -euo pipefail
          # Keep terminal errors visible even if a massive compile overwhelms
          # the workflow log service.
          if ! out=$(nix build -L --no-link --print-out-paths ".#packages.x86_64-linux.$WORKLOAD" 2> "$RUNNER_TEMP/workload-build.log"); then
            tail -n 150 "$RUNNER_TEMP/workload-build.log" >&2
            exit 1
          fi
          tail -n 40 "$RUNNER_TEMP/workload-build.log" >&2
          case "$WORKLOAD" in
            neko7-minecraft-system)
              test -x "$out/init"
              test -x "$out/bin/switch-to-configuration"
              ;;
            neko7-t3-runtime)
              test -x "$out/bin/t3"
              test -x "$out/bin/codex"
              ;;
            neko7-splitcast-runtime)
              unit="$out/share/systemd/user/splitcast-production.service"
              test -r "$unit"
              test -r "$out/share/splitcast/production.toml"
              grep -F 'ExecStart=' "$unit" | grep -F 'splitcast-migration-gated'
              if grep -q '^WantedBy=' "$unit"; then exit 1; fi
              ;;
          esac
      - name: Preserve failed build diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.workload }}
          path: ${{ runner.temp }}/workload-build.log
          if-no-files-found: ignore
          retention-days: 7

  ingress:
    name: Tailnet-only ingress negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify host policy and execute firewall machine test
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          attr=.#nixosConfigurations.neko7.config
          nix eval --json "$attr.local.features.tailnet-ingress.enable" | jq -e '. == true'
          nix eval --json "$attr.networking.nat.forwardPorts" | jq -e 'length == 0'
          nix eval --json "$attr.networking.nftables.tables.tailnet_ingress.family" | jq -e '. == "inet"'
          nix build -L --no-link .#checks.x86_64-linux.tailnet-ingress
  integration:
    name: Incus ${{ matrix.kind }} lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        kind: [container]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check KVM availability (required for real machine evidence)
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          grep -E 'vmx|svm' /proc/cpuinfo | head -c 1000 || true
          df -h
      - name: Evaluate host integration and preserve privilege boundary
        run: |
          set -euo pipefail
          attr=.#nixosConfigurations.neko7.config
          nix eval --json "$attr.virtualisation.incus.enable" | jq -e '. == true'
          nix eval --raw "$attr.virtualisation.incus.package.version"
          nix eval --raw "$attr.virtualisation.incus.package.drvPath"

          nix eval --json "$attr.virtualisation.incus.preseed" | jq -e '
            .config["core.https_address"] == "127.0.0.1:8443"
            and (.projects[] | select(.name == "lab") | .config.restricted == "true" and (.config | keys | all(startswith("limits.") | not)))
            and (.profiles[] | select(.project == "lab") | .config | keys | all(startswith("limits.") | not))
          '
          nix eval --json "$attr.users.users.tenzyu.extraGroups" | jq -e 'index("incus-admin") == null and index("incus") == null'
          nix eval --json "$attr.containers" --apply builtins.attrNames | jq -e 'index("neko7-mc") != null'
          nix eval --raw "$attr.system.build.toplevel.drvPath"
      - name: Evaluate native VM lifecycle checks
        run: |
          nix eval --raw .#checks.x86_64-linux.compute-host-vm.drvPath
      - name: Build and execute NixOS machine test
        run: nix build -L --no-link .#checks.x86_64-linux.compute-host-${{ matrix.kind }}
      - name: Record acceptance boundary
        if: always()
        run: |
          echo 'Hosted evidence is not native Incus KVM acceptance. Native compute-host-vm and exact-image lifecycle checks must pass on an approved compatible test host before merge or activation.' >> "$GITHUB_STEP_SUMMARY"
