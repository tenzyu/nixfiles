name: Diagnostic SplitCast lock and signed cache
on:
  push:
    branches: ['diagnostic/splitcast-cache-b6fcf158-20261127']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify committed lock without changing it
        run: |
          set -euo pipefail
          jq -e '.nodes.splitcast.locked.rev == "b6fcf1588fec4c42b0e22df58f3bca53c2f51b6f"' flake.lock
          nix flake metadata --json --no-write-lock-file > "$RUNNER_TEMP/metadata.json"
          jq -e '.locks.nodes.splitcast.locked.rev == "b6fcf1588fec4c42b0e22df58f3bca53c2f51b6f"' "$RUNNER_TEMP/metadata.json"
          git diff --exit-code -- flake.lock
          printf 'CANDIDATE e4f4d0cba2802dd9ae038cb9371686b56c110985\n'
      - name: Verify release manifest and exact consumer roots
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 'https://github.com/tenzyu/splitcast/releases/download/nix-cache-b6fcf1588fec4c42b0e22df58f3bca53c2f51b6f-45916419238-1/manifest.json' -o "$RUNNER_TEMP/manifest.json"
          echo '81810201f03163678fb90c871972fb316942ff592601d3f297bcd690426f7281  '"$RUNNER_TEMP/manifest.json" | sha256sum --check
          jq -e '.revision.sha == "b6fcf1588fec4c42b0e22df58f3bca53c2f51b6f" and .revision.system == "x86_64-linux"' "$RUNNER_TEMP/manifest.json"
          jq '{revision,roots,custom}' "$RUNNER_TEMP/manifest.json"
          for name in splitcast splitcast-web splitcast-obs; do
            path=$(nix eval --impure --raw --expr "let f = builtins.getFlake (toString ./.); in f.inputs.splitcast.packages.x86_64-linux.\"$name\".outPath")
            jq -e --arg p "$path" '.closure | has($p)' "$RUNNER_TEMP/manifest.json"
            if [[ "$name" != splitcast-obs ]]; then
              jq -e --arg p "$path" '.roots.native == $p' "$RUNNER_TEMP/manifest.json"
            fi
            printf 'ROOT %s %s\n' "$name" "$path"
          done
      - name: Regression and real isolated signed-copy audit
        run: |
          bash scripts/ci/test-splitcast-cache.sh "$PWD/scripts/ci/audit-splitcast-cache.sh"
          bash scripts/ci/audit-splitcast-cache.sh --strict
          git diff --exit-code
  ci-substitution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # Same signed upstream cache already trusted by nixfiles and pinned
          # llm-agents.nix; no unsigned substitution or package changes.
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - name: Configure existing signed SplitCast cache
        run: |
          set -euo pipefail
          policy=$(nix eval --json --file modules/50-features/media/_internal/cache.nix)
          jq -er '."extra-substituters" | join(" ") | "extra-substituters = " + .' <<< "$policy" | sudo tee -a /etc/nix/nix.conf
          jq -er '."extra-trusted-public-keys" | join(" ") | "extra-trusted-public-keys = " + .' <<< "$policy" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon.service
          nix config show | grep -Fx 'require-sigs = true'
      - name: Require exact native and OBS derivations to be substitutable before build
        run: |
          set -euo pipefail
          policy=$(nix eval --json --file modules/50-features/media/_internal/cache.nix)
          url=$(jq -er '."extra-substituters"[0]' <<< "$policy")
          key=$(jq -er '."extra-trusted-public-keys"[0]' <<< "$policy")
          nix config show | grep -F "$url"
          nix config show | grep -F "$key"
          for name in splitcast splitcast-obs; do
            expr="let f = builtins.getFlake (toString ./.); in f.inputs.splitcast.packages.x86_64-linux.\"$name\""
            drv=$(nix eval --impure --raw --expr "$expr.drvPath")
            root=$(nix eval --impure --raw --expr "$expr.outPath")
            printf 'PACKAGE %s %s %s\n' "$name" "$drv" "$root"
            printf '%s\n' "$drv" >> "$RUNNER_TEMP/splitcast-drvs"
            printf '%s\n' "$root" >> "$RUNNER_TEMP/splitcast-roots"
            if nix path-info "$root" >/dev/null 2>&1; then
              echo "::error::Not a cold consumer: $root"; exit 1
            fi
          done
          nix build --dry-run --no-link .#packages.x86_64-linux.neko7-splitcast-runtime 2>&1 | tee "$RUNNER_TEMP/plan"
          while IFS= read -r drv; do
            if grep -Fq "$drv" "$RUNNER_TEMP/plan"; then
              echo "::error::Unexpected SplitCast build plan: $drv"; exit 1
            fi
          done < "$RUNNER_TEMP/splitcast-drvs"
      - name: Build and inspect independent artifact using original checks
        env:
          WORKLOAD: neko7-splitcast-runtime
        run: |
          set -euo pipefail
          # Keep terminal errors visible even if a massive compile overwhelms
          # the workflow log service.
          if ! out=$(nix build -L --no-link --print-out-paths ".#packages.x86_64-linux.$WORKLOAD" 2> "$RUNNER_TEMP/workload-build.log"); then
            tail -n 150 "$RUNNER_TEMP/workload-build.log" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/workload-build.log" >&2
          case "$WORKLOAD" in
            neko7-minecraft-system)
              test -x "$out/init"
              test -x "$out/bin/switch-to-configuration"
              ;;
            neko7-t3-runtime)
              test -x "$out/bin/t3"
              test -x "$out/bin/codex"
              ;;
            neko7-splitcast-runtime)
              unit="$out/share/systemd/user/splitcast-production.service"
              test -r "$unit"
              test -r "$out/share/splitcast/production.toml"
              grep -F 'ExecStart=' "$unit" | grep -F 'splitcast-migration-gated'
              if grep -q '^WantedBy=' "$unit"; then exit 1; fi
              ;;
          esac
      - name: Verify actual artifact build consumed the signed cache
        run: |
          set -euo pipefail
          policy=$(nix eval --json --file modules/50-features/media/_internal/cache.nix)
          url=$(jq -er '."extra-substituters"[0]' <<< "$policy")
          while IFS= read -r root; do
            grep -F "copying path '$root' from '$url'" "$RUNNER_TEMP/workload-build.log"
            nix path-info "$root"
          done < "$RUNNER_TEMP/splitcast-roots"
          while IFS= read -r drv; do
            if grep -Fq "building '$drv'" "$RUNNER_TEMP/workload-build.log"; then
              echo "::error::Recompiled cached SplitCast dependency: $drv"; exit 1
            fi
          done < "$RUNNER_TEMP/splitcast-drvs"
          echo 'CI-SUBSTITUTION-OK: actual independent artifact consumed both exact signed package roots'
