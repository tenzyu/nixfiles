name: Nix validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache_strict:
        description: Verify signed SplitCast cache copies in an isolated store
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nix-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Nix evaluation and focused regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build -L --no-link .#checks.x86_64-linux.validation

  stateful:
    name: Home Manager migration and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          nix build -L --no-link .#checks.x86_64-linux.home-migration

  cache-audit:
    name: On-demand signed SplitCast cache verification
    if: github.event_name == 'workflow_dispatch' && inputs.cache_strict
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci/audit-splitcast-cache.sh --strict
