name: Nix validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Evaluate hosts and run regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate flake and build declared checks
        run: nix flake check -L --show-trace

      - name: Evaluate each NixOS host closure
        shell: bash
        run: |
          set -euo pipefail
          for host in neko5 neko6 neko7; do
            echo "::group::Evaluate ${host}"
            nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
            echo "::endgroup::"
          done

      - name: Framework Nix-unit tests and nixd invariants
        run: nix run -L .#framework-test

