name: Nix validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Build every declared flake check (expensive)"
        type: boolean
        default: false
      cache_strict:
        description: "Verify signed SplitCast cache copies in isolated store (expensive)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nix-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Nix evaluation and focused regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # For multi-commit pushes use the event's before SHA; PRs use merge-parent.
      NIX_CHECK_BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Fetch full history: push 'before' may span multiple commits.
          # For pull requests, HEAD^ is the synthetic merge's base parent.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Do not use 'nix flake check' in a PR gate: it builds *all* checks,
      # including unrelated Rust and system-level derivations.
      - name: Build narrowly scoped, deterministic checks
        run: |
          nix build -L --no-link \
            .#checks.x86_64-linux.framework-cli \
            .#checks.x86_64-linux.deprecated-patterns \
            .#checks.x86_64-linux.feature-name-shape

      - name: Validate Markdown, OKF provenance and memory routes
        run: |
          python3 -m unittest discover -v -s scripts/ci -p 'test_docs.py'
          python3 -m unittest discover -v -s scripts/ci -p 'test_memory.py'
          python3 scripts/ci/check_docs.py
          python3 scripts/ci/wiki_scan.py --summary
          python3 scripts/ci/retrieval_eval.py --smoke
          python3 scripts/ci/retrieval_eval.py --rank > /tmp/nixfiles-retrieval-route-report.json
          python3 -m json.tool /tmp/nixfiles-retrieval-route-report.json > /dev/null
          python3 -c 'import json; r=json.load(open("/tmp/nixfiles-retrieval-route-report.json")); print("Lexical path recall@{} (NOT answer accuracy): {}".format(r["k"], r["route_hits"]))'

      - name: Test selective-check mapping
        run: python3 -m unittest discover -v -s scripts/ci -p 'test_select_checks.py'

      - name: Select focused checks from the event diff
        id: selection
        run: python3 scripts/ci/select-checks.py --github-output >> "$GITHUB_OUTPUT"

      - name: Build affected feature checks
        if: steps.selection.outputs.checks != ''
        shell: bash
        env:
          SELECTED_CHECKS: ${{ steps.selection.outputs.checks }}
        run: |
          set -euo pipefail
          read -r -a attrs <<< "$SELECTED_CHECKS"
          nix build -L --no-link "${attrs[@]}"

      - name: Exercise the offline osu! lab fixture
        if: steps.selection.outputs.osu_lab == 'yes'
        run: python3 scripts/osu-performance/test-osu-lab.py

      - name: Validate SplitCast cache audit CLI
        run: |
          bash -n scripts/ci/audit-splitcast-cache.sh
          bash scripts/ci/audit-splitcast-cache.sh --help
          if bash scripts/ci/audit-splitcast-cache.sh --unknown-option; then
            echo "cache audit accepted an invalid option" >&2
            exit 1
          fi

      - name: Audit SplitCast cache paths when inputs or consumers change
        if: steps.selection.outputs.cache_probe == 'yes'
        run: bash scripts/ci/audit-splitcast-cache.sh

      - name: Exercise the neko7 Serve route without a daemon
        run: bash scripts/test-t3code-tailnet.sh

      - name: Test framework semantics and editor option types
        id: framework
        run: nix run -L .#framework-test

      # The interactive framework CLI intentionally redacts subprocess output.
      # On CI failure, independently evaluate the public source fixture to
      # distinguish evaluation errors from assertion failures (names only).
      - name: Diagnose configuration adapter failures
        if: failure() && steps.framework.outcome == 'failure'
        shell: bash
        run: |
          nix eval --impure --json --show-trace \
            --file modules/_internal/configurations/tests/configurations.nix \
            --argstr flakeRef "git+file://$PWD" failures \
            --apply 'failures: map (failure: failure.name) failures'

      # Compatibility state is not the Nixpkgs release. Keep the verified
      # neko5 baseline and the explicitly declared neko7 baseline stable.
      - name: Build and check Mako's systemd-owned D-Bus provider when changed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --name-only "$NIX_CHECK_BASE" HEAD | grep -Fxq 'modules/50-features/desktop/mako.nix'; then
            echo 'Mako provider unchanged'
            exit 0
          fi
          provider="$(nix build -L --no-link --print-out-paths --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              home = flake.nixosConfigurations.neko5.config.home-manager.users.tenzyu;
            in
              builtins.head (builtins.filter (pkg: (pkg.pname or "") == "mako") home.home.packages)
          ')"
          service="$provider/share/dbus-1/services/org.freedesktop.Notifications.service"
          test -f "$service"
          test ! -e "$provider/share/dbus-1/services/fr.emersion.mako.service"
          test -f "$provider/lib/systemd/user/mako.service"
          grep -Fxq 'Name=org.freedesktop.Notifications' "$service"
          grep -Fxq 'SystemdService=mako.service' "$service"
          grep -Fxq 'Type=dbus' "$provider/lib/systemd/user/mako.service"
          grep -Fxq 'BusName=org.freedesktop.Notifications' "$provider/lib/systemd/user/mako.service"

      - name: Guard explicitly pinned NixOS state compatibility
        shell: bash
        run: |
          set -euo pipefail
          for host in neko5 neko7; do
            actual="$(nix eval --raw ".#nixosConfigurations.${host}.config.system.stateVersion")"
            if [[ "$actual" != "26.05" ]]; then
              echo "::error::${host} system.stateVersion drifted: expected 26.05, got ${actual}" >&2
              exit 1
            fi
          done

      - name: Verify Nix daemon and remote-builder trust boundary
        shell: bash
        run: |
          set -euo pipefail
          for host in neko5 neko7; do
            value="$(nix eval --json ".#nixosConfigurations.${host}.config.nix.settings.accept-flake-config")"
            if [[ "$value" != "false" ]]; then
              echo "::error::${host} must not auto-accept flake-provided Nix configuration" >&2
              exit 1
            fi
          done
          nix eval --json .#nixosConfigurations.neko7.config.users.users.nixbuilder.openssh.authorizedKeys.keys |
            jq -e 'length == 1 and (.[0] | startswith("restrict,command=") and contains("/bin/nix-daemon --stdio") and contains("ssh-ed25519 "))'
          nix eval --json .#nixosConfigurations.neko7.config.nix.settings.trusted-users |
            jq -e 'index("nixbuilder") != null'
          nix eval --json .#nixosConfigurations.neko5.config.nix.buildMachines |
            jq -e 'any(.[]; .protocol == "ssh-ng" and .sshUser == "nixbuilder")'

      - name: Evaluate all NixOS host derivations without building systems
        shell: bash
        run: |
          set -euo pipefail
          for host in neko5 neko6 neko7; do
            echo "::group::Evaluate ${host}"
            nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
            echo "::endgroup::"
          done

      - name: Evaluate primary Jay and standalone Gamescope
        shell: bash
        run: |
          set -euo pipefail
          nix eval --impure --json --expr '
            let
              f = builtins.getFlake (toString ./.);
              c = f.nixosConfigurations.neko5.config;
              h = c.home-manager.users.tenzyu;
              audioRulePath = "pipewire/client.conf.d/90-neko5-osu-quantum.conf";
              clientRtPath = "pipewire/client.conf.d/90-neko5-rtkit.conf";
              rtArgs = { "rtportal.enabled" = false; "rtkit.enabled" = true; };
              otherSystem = f.nixosConfigurations.neko7.config;
              other = otherSystem.home-manager.users.tenzyu;
              routes = home: map (r: { inherit (r) group source target route; }) home.local.homeMigration.paths;
              check = compositor: s:
                let
                  sh = s.home-manager.users.tenzyu;
                  audio = s.services.pipewire.extraConfig;
                  rate = audio.pipewire."90-neko5-rate"."context.properties";
                  rules = builtins.fromJSON sh.xdg.configFile.${audioRulePath}.text;
                  clientRt = builtins.fromJSON sh.xdg.configFile.${clientRtPath}.text;
                  pulseRt = audio.pipewire-pulse."90-neko5-rtkit";
                  alsa = (builtins.head s.services.pipewire.wireplumber.extraConfig."90-neko5-alc257-lowlatency"."monitor.alsa.rules").actions."update-props";
                  names = map (p: p.name or "") s.environment.systemPackages;
                in {
                  profile = s.local.features.jay.enable == (compositor == "jay") && sh.local.features.jay.enable == (compositor == "jay") && s.local.features.gamescope.enable == (compositor == "gamescope");
                  launcher = (builtins.elem "start-jay" names) == (compositor == "jay") && (builtins.elem "start-gamescope" names) == (compositor == "gamescope") && !(builtins.elem "neko5-slim-session" names);
                  legacyDesktopDisabled = !s.programs.hyprland.enable && !sh.local.features.waybar.enable && !sh.local.features.hyprpaper.enable && !sh.local.features.neko5-osu-first.enable;
                  systemPolicy = s.local.features.neko5-hardware.enable && (builtins.elem "preempt=full" s.boot.kernelParams) && s.powerManagement.cpuFreqGovernor == "powersave" && s.systemd.services ? neko5-hwp-epp && s.services.tailscale.enable && s.services.pipewire.enable && s.services.openssh.enable && s.nix.distributedBuilds;
                  identity = s.networking.hostName == c.networking.hostName && s.system.stateVersion == c.system.stateVersion && sh.home.stateVersion == h.home.stateVersion && sh.home.homeDirectory == h.home.homeDirectory && routes sh == routes h;
                  audio = rate."default.clock.rate" == 48000 && rate."default.clock.allowed-rates" == [48000] && !(audio.pipewire ? "99-neko5-experiment") && !(audio.client ? "90-neko5-osu-quantum") && rules == { "stream.rules" = [{ matches = [{ "node.name" = "alsa_playback.osu!"; }]; actions.update-props."node.max-latency" = "64/48000"; }]; };
                  realtime = s.security.rtkit.enable && clientRt == { "module.rt.args" = rtArgs; } && pulseRt == clientRt && !(audio.pipewire ? "90-neko5-rtkit") && !(audio.client ? "90-neko5-rtkit");
                  hardwareAudio = alsa."api.alsa.headroom" == 0 && alsa."api.alsa.period-size" == 128 && alsa."api.alsa.period-num" == 3 && !alsa."api.alsa.disable-tsched";
                  desktopPackages = let
                    pkgs = sh.home.packages;
                    has = name: builtins.any (p: (p.pname or (p.name or "")) == name) pkgs;
                    herdr = builtins.filter (p: (p.pname or "") == "herdr") pkgs;
                  in !has "cliphist" && !has "grimblast"
                    && has "cclip-picker" == (compositor == "jay")
                    && has "jay-tofi-actions" == (compositor == "jay")
                    && builtins.length herdr == 1
                    && ((builtins.head herdr) ? unwrapped) == (compositor == "jay");
                  drv = s.system.build.toplevel.drvPath;
                };
            in {
              primary = check "jay" c;
              probe = check "gamescope" c.specialisation.neko5-gamescope.configuration;
              onlyProbe = builtins.attrNames c.specialisation == ["neko5-gamescope"];
              audioIsolated = !(builtins.hasAttr audioRulePath other.xdg.configFile) && !(builtins.hasAttr clientRtPath other.xdg.configFile) && !(otherSystem.services.pipewire.extraConfig.pipewire-pulse ? "90-neko5-rtkit");
              jay = h.xdg.configFile."jay/config.toml".text;
              skinAssociation = h.xdg.mimeApps.defaultApplications."application/x-osu-skin";
              fileAssociation = h.xdg.mimeApps.defaultApplications."inode/directory";
              alacrittyOsc52 = h.programs.alacritty.settings.terminal.osc52;
              herdrReusesStock = let
                packages = builtins.filter (p: (p.pname or "") == "herdr") h.home.packages;
                stock = f.nixosConfigurations.neko5.pkgs.llm-agents.herdr;
              in builtins.length packages == 1 && (builtins.head packages).unwrapped.drvPath == stock.drvPath;
            }
          ' > /tmp/neko5-experiments.json
          jq -e '.onlyProbe and .audioIsolated and ([.primary,.probe] | all(.[]; .profile and .launcher and .legacyDesktopDisabled and .systemPolicy and .identity and .audio and .realtime and .hardwareAudio and .desktopPackages and (.drv | endswith(".drv"))))' /tmp/neko5-experiments.json
          python3 scripts/desktop/check-experiment-config.py /tmp/neko5-experiments.json
          python3 -m py_compile scripts/desktop/slim-memory.py
          python3 scripts/desktop/test-clipboard-integration.py

  desktop-packages:
    name: Build changed neko5 desktop packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NIX_CHECK_BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed desktop package definitions
        id: desktop
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$NIX_CHECK_BASE" HEAD)"
          for name in cclip fileman; do
            if printf '%s\n' "$changed" | grep -Eq "^assets/packages/$name\.nix$|^modules/50-features/desktop/$name\.nix$|^flake\.lock$"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: cachix/install-nix-action@v31
        if: steps.desktop.outputs.cclip == 'true' || steps.desktop.outputs.fileman == 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke-test selected desktop packages
        if: steps.desktop.outputs.cclip == 'true' || steps.desktop.outputs.fileman == 'true'
        shell: bash
        env:
          BUILD_CCLIP: ${{ steps.desktop.outputs.cclip }}
          BUILD_FILEMAN: ${{ steps.desktop.outputs.fileman }}
        run: |
          set -euo pipefail
          build_package() {
            PKG_NAME="$1" nix build -L --no-link --print-out-paths --impure --expr '
              let
                f = builtins.getFlake (toString ./.);
                h = f.nixosConfigurations.neko5.config.home-manager.users.tenzyu;
                name = builtins.getEnv "PKG_NAME";
              in builtins.head (builtins.filter (p: (p.pname or "") == name) h.home.packages)
            '
          }
          if [[ "$BUILD_CCLIP" == true ]]; then
            out="$(build_package cclip)"
            "$out/bin/cclip" -h >/dev/null
            "$out/bin/cclipd" -h >/dev/null 2>&1
            test -x "$out/bin/cclipd"
            if ldd "$out/bin/cclipd" | grep -F 'not found'; then exit 1; fi
          fi
          if [[ "$BUILD_FILEMAN" == true ]]; then
            out="$(build_package fileman)"
            test -x "$out/bin/fileman"
            test -f "$out/share/applications/dev.fileman.Files.desktop"
          fi

  osu-first:
    name: Offline osu-first launcher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test launcher logic without games or services
        run: |
          bash -n scripts/osu-performance/osu-first.sh
          bash scripts/osu-performance/test-osu-first.sh

  full-audit:
    name: On-demand full flake check (expensive)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check -L --show-trace

  cache-audit:
    name: On-demand signed SplitCast cache verification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_strict }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci/audit-splitcast-cache.sh --strict
