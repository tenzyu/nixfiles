name: Nix validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Build every declared flake check (expensive)"
        type: boolean
        default: false
      cache_strict:
        description: "Verify signed SplitCast cache copies in isolated store (expensive)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nix-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Nix evaluation and focused regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # PR checkouts use the synthetic merge commit. Its first parent
          # is the target base; push checkouts use the previous commit.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Do not use 'nix flake check' in a PR gate: it builds *all* checks,
      # including unrelated Rust and system-level derivations.
      - name: Build narrowly scoped, deterministic checks
        run: |
          nix build -L --no-link \
            .#checks.x86_64-linux.framework-cli \
            .#checks.x86_64-linux.deprecated-patterns \
            .#checks.x86_64-linux.feature-name-shape

      - name: Validate Markdown, OKF provenance and memory routes
        run: |
          python3 -m unittest discover -v -s scripts/ci -p 'test_docs.py'
          python3 -m unittest discover -v -s scripts/ci -p 'test_memory.py'
          python3 scripts/ci/check_docs.py
          python3 scripts/ci/wiki_scan.py --summary
          python3 scripts/ci/retrieval_eval.py --smoke
          python3 scripts/ci/retrieval_eval.py --rank > /tmp/nixfiles-retrieval-route-report.json
          python3 -m json.tool /tmp/nixfiles-retrieval-route-report.json > /dev/null
          python3 -c 'import json; r=json.load(open("/tmp/nixfiles-retrieval-route-report.json")); print("Lexical path recall@{} (NOT answer accuracy): {}".format(r["k"], r["route_hits"]))'

      - name: Test selective-check mapping
        run: python3 -m unittest discover -v -s scripts/ci -p 'test_select_checks.py'

      # The standard three focused checks above always run. These additional
      # checks run only when their implementation or lock input changes.
      - name: Build affected feature checks
        shell: bash
        run: |
          set -euo pipefail
          selected="$(python3 scripts/ci/select-checks.py)"
          if [[ -z "$selected" ]]; then
            echo "No extra feature-specific checks for this diff"
          else
            mapfile -t attrs <<< "$selected"
            printf 'Selected additional checks: %s\n' "${attrs[*]}"
            nix build -L --no-link "${attrs[@]}"
          fi

      - name: Validate SplitCast cache audit CLI
        run: |
          bash -n scripts/ci/audit-splitcast-cache.sh
          bash scripts/ci/audit-splitcast-cache.sh --help
          if bash scripts/ci/audit-splitcast-cache.sh --unknown-option; then
            echo "cache audit accepted an invalid option" >&2
            exit 1
          fi

      - name: Audit SplitCast cache paths when inputs or consumers change
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(python3 scripts/ci/select-checks.py --cache-only)" == yes ]]; then
            bash scripts/ci/audit-splitcast-cache.sh
          else
            echo "SplitCast cache inputs unchanged; skipping read-only probe"
          fi

      - name: Exercise the neko7 Serve route without a daemon
        run: bash scripts/test-t3code-tailnet.sh

      - name: Test framework semantics and editor option types
        run: nix run -L .#framework-test

      # Compatibility state is not the Nixpkgs release. Keep the verified
      # neko5 baseline and the explicitly declared neko7 baseline stable.
      - name: Guard explicitly pinned NixOS state compatibility
        shell: bash
        run: |
          set -euo pipefail
          for host in neko5 neko7; do
            actual="$(nix eval --raw ".#nixosConfigurations.${host}.config.system.stateVersion")"
            if [[ "$actual" != "26.05" ]]; then
              echo "::error::${host} system.stateVersion drifted: expected 26.05, got ${actual}" >&2
              exit 1
            fi
          done

      - name: Verify Nix daemon and remote-builder trust boundary
        shell: bash
        run: |
          set -euo pipefail
          for host in neko5 neko7; do
            value="$(nix eval --json ".#nixosConfigurations.${host}.config.nix.settings.accept-flake-config")"
            if [[ "$value" != "false" ]]; then
              echo "::error::${host} must not auto-accept flake-provided Nix configuration" >&2
              exit 1
            fi
          done
          nix eval --json .#nixosConfigurations.neko7.config.users.users.nixbuilder.openssh.authorizedKeys.keys |
            jq -e 'length == 1 and (.[0] | startswith("restrict,command=") and contains("/bin/nix-daemon --stdio") and contains("ssh-ed25519 "))'
          nix eval --json .#nixosConfigurations.neko7.config.nix.settings.trusted-users |
            jq -e 'index("nixbuilder") != null'
          nix eval --json .#nixosConfigurations.neko5.config.nix.buildMachines |
            jq -e 'any(.[]; .protocol == "ssh-ng" and .sshUser == "nixbuilder")'

      - name: Evaluate all NixOS host derivations without building systems
        shell: bash
        run: |
          set -euo pipefail
          for host in neko5 neko6 neko7; do
            echo "::group::Evaluate ${host}"
            nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
            echo "::endgroup::"
          done

  full-audit:
    name: On-demand full flake check (expensive)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check -L --show-trace

  cache-audit:
    name: On-demand signed SplitCast cache verification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_strict }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/ci/audit-splitcast-cache.sh --strict
