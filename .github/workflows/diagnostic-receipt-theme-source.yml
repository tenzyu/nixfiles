# Diagnostic only. Never integrate.
name: Diagnostic full receipt audit
on:
  push:
    branches: [diagnostics/verification-receipt-audit-fixed]
permissions:
  contents: read
  actions: read
jobs:
  replay-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit all 260 executed gate identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin 9baf5677f699ca0773b9a1cca4b0d079b67871a6 920c6bc37810d0a8cd29281ef59ce7385e11ba74
          python3 scripts/ci/verification-convergence/replay_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-receipt-audit
          path: ${{ runner.temp }}/replay-audit
          retention-days: 3
