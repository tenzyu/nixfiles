name: CI Catppuccin NarInfo and closure probe (diagnostic only)
on:
  push:
    branches: [ci/diagnostic-catppuccin-narinfo-20261127]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 113408498954d9df3c55d72c202bfd7a801e5a3a
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com https://catppuccin.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=
      - name: Probe pinned output and public cache metadata
        run: |
          set -euo pipefail
          git rev-parse HEAD
          nix --version
          nix config show | grep -Fx 'require-sigs = true'
          path=/nix/store/jrjyng3nxqhsqdf7awbr512ffwqdvv2d-whiskers-2.9.0
          hash=jrjyng3nxqhsqdf7awbr512ffwqdvv2d
          # Public NarInfo responses; do not accept unsigned output, build,
          # change the lock or install any new trust authority.
          for cache in https://catppuccin.cachix.org https://cache.nixos.org https://cache.numtide.com; do
            status=$(curl --silent --show-error --location --max-time 30 --output "$RUNNER_TEMP/narinfo" --write-out '%{http_code}' "$cache/$hash.narinfo") || status=transport-error
            echo "NARINFO_CACHE=$cache HTTP=$status"
            if [[ "$status" == 200 ]]; then
              grep -E '^(StorePath|NarHash|NarSize|References|Sig|Deriver|FileSize):' "$RUNNER_TEMP/narinfo" || true
              grep -Fx "StorePath: $path" "$RUNNER_TEMP/narinfo"
              # Distinct store root and no build fallback. Verify all paths under
              # the effective trusted keys; this is a closure, not metadata-only test.
              dest="local?root=$RUNNER_TEMP/probe-${hash}-$(basename "$cache")"
              if nix copy --from "$cache" --to "$dest" "$path"; then
                nix --store "$dest" path-info --recursive "$path"
                if nix --store "$dest" store verify --recursive "$path"; then
                  echo "SIGNED_CLOSURE_VERIFIED=$cache"
                else
                  echo "SIGNED_CLOSURE_VERIFY_FAILED=$cache"
                fi
              else
                echo "SIGNED_CLOSURE_COPY_FAILED=$cache"
              fi
            fi
          done
          # Evaluate the actual locked upstream package identity without building it.
          /usr/bin/time -f 'IDENTITY_EVAL_SECONDS=%e' nix eval --impure --json --expr '
            let f = builtins.getFlake (toString ./.);
                p = f.inputs.catppuccin.packages.x86_64-linux;
            in builtins.listToAttrs (map (n: { name = n; value = { inherit (p.${n}) drvPath outPath; }; }) ["whiskers" "firefox" "starship" "palette"])
          ' > "$RUNNER_TEMP/identity.json"
          cat "$RUNNER_TEMP/identity.json"
          jq -e --arg p "$path" '.whiskers.outPath == $p' "$RUNNER_TEMP/identity.json"
          git diff --exit-code
          echo PINNED_OUTPUT_IDENTITY_EQUAL=1
