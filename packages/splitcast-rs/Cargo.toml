[package]
name = "splitcast-rs-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Isolated, opt-in Rust lifecycle and process-owner core for a future SplitCast rewrite"

[lib]
name = "splitcast_rs_core"
path = "src/lib.rs"

[[bin]]
name = "splitcast-rs-core"
path = "src/main.rs"

[dependencies]
libc = "0.2"
ureq = { version = "3.1.2", default-features = false }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
sha2 = "0.10"
base64 = "0.22"
splitcast-protocol = { path = "../splitcast-protocol" }
regex = "1"
serde_json = "1"
toml = "0.8"
