[package]
name = "splitcast-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
splitcast-protocol = { path = "../splitcast-protocol" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"
web-sys = { version = "=0.3.98", features = ["Window", "Document", "Element", "Node", "Event", "EventTarget", "HtmlInputElement", "Request", "RequestInit", "RequestMode", "Response", "Headers"] }
