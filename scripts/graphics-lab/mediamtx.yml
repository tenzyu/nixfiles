# DirectCast Lab: independent of an existing SplitCast MediaMTX instance.
# Media listeners are loopback-only. Publish through an SSH local forward.
logLevel: info
api: false
metrics: false
pprof: false
playback: false
hls: false
webrtc: false
srt: false
rtmp: true
rtmpAddress: 127.0.0.1:11935
rtsp: true
rtspAddress: 127.0.0.1:18554
rtspTransports: [tcp]
paths:
  game:
    source: publisher
